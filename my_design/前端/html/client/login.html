<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>读者登录 - 智慧书阁</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="client-redirect-banner">📢 此页面已升级，<a href="/student/login.html">点击前往新版</a></div>
<div class="login-page">
    <div class="login-brand">
        <div class="brand-icon"><i class="bi bi-book-half"></i></div>
        <h1>智慧书阁</h1>
        <p class="tagline">知识的海洋，触手可及</p>
        <div class="copyright">&copy; 2026 智慧书阁</div>
    </div>
    <div class="login-form-panel">
        <div class="login-form-card">
            <div class="form-header">
                <div class="mb-2"><i class="bi bi-person" style="font-size:2.5rem;color:var(--primary);"></i></div>
                <h3>读者登录</h3>
                <p>欢迎回来，继续你的阅读之旅</p>
            </div>
            <div id="msg"></div>
            <form onsubmit="login(event)">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" id="username" class="form-control" placeholder="请输入用户名" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                        <button type="button" class="password-toggle" onclick="togglePwd()" tabindex="-1"><i class="bi bi-eye" id="pwdIcon"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn-gradient mb-3" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right"></i> 登录
                </button>
            </form>
            <div class="form-footer">
                <a href="/student/register.html">还没有账号？立即注册</a>
                <span class="divider">|</span>
                <a href="/admin/login.html"><i class="bi bi-shield-lock"></i> 管理员入口</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd() {
    var pwd = document.getElementById('password');
    var icon = document.getElementById('pwdIcon');
    if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'bi bi-eye-slash'; }
    else { pwd.type = 'password'; icon.className = 'bi bi-eye'; }
}
function login(e) {
    e.preventDefault();
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    if (!u || !p) { showMsg('danger', '请填写用户名和密码'); return; }
    var btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 登录中...';
    fetch('/api/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username:u, password:p, loginType:'reader'})
    }).then(function(r){ return r.json(); }).then(function(res){
        if (res.code === 200) {
            localStorage.setItem('user', JSON.stringify(res.data));
            window.location.href = '/';
        } else {
            showMsg('danger', res.message);
            btn.disabled = false; btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> 登录';
        }
    }).catch(function(){ showMsg('danger', '网络异常'); btn.disabled = false; btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> 登录'; });
}
function showMsg(type, text){ document.getElementById('msg').innerHTML = '<div class="alert alert-' + type + '">' + text + '</div>'; }
</script>
</body>
</html>
