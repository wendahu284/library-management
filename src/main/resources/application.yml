# ============================================================
# 图书管理系统 - 应用配置文件
# ============================================================

server:
  port: 8080

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:112749601}

  # Jackson JSON 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis 配置
mybatis:
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类别名（简化 XML 中 resultType 书写）
  type-aliases-package: com.library.entity
  configuration:
    # 驼峰命名自动映射：数据库下划线字段 → Java 驼峰属性
    map-underscore-to-camel-case: true
    # SQL 日志输出（开发环境开启，生产环境关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 借阅业务规则配置
library:
  borrow:
    max-count: 5           # 每位读者最大同时借阅数量
    duration-days: 30      # 单次借阅期限（天）
