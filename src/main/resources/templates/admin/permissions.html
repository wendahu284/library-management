<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权限管理 - 智慧书阁管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="admin-main" id="contentArea">
    <div id="alertBox"></div>
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#roleTab">角色管理</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#logTab">操作日志</button></li>
    </ul>
    <div class="tab-content">
        <!-- 角色管理 -->
        <div class="tab-pane fade show active" id="roleTab">
            <div class="row g-4" id="roleCards"><div class="col-12 text-center py-5 text-muted">加载中...</div></div>
        </div>

        <!-- 操作日志 -->
        <div class="tab-pane fade" id="logTab">
            <div class="card shadow-sm"><div class="card-body">
                <div class="table-container">
                    <table class="data-table"><thead><tr><th>时间</th><th>操作人</th><th>操作类型</th><th>目标</th><th>详情</th><th>IP</th></tr></thead><tbody id="logTbody"></tbody></table>
                    <div id="logPagination" class="pagination-bar"></div>
                </div>
            </div></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app-common.js"></script>
<script src="/js/admin-common.js"></script>
<script>
var logPageNum = 1;
var logPageSize = 15;

(function(){
    if (!initAdminPage('权限管理')) return;
    loadRoles();
    loadLogs();
})();

async function loadRoles() {
    var res = await api.get('/admin/permissions');
    if (res.code !== 200) return;
    var allPerms = res.data.allPermissions || [];
    var adminPermIds = res.data.adminPermissionIds || [];
    var readerPermIds = res.data.readerPermissionIds || [];

    var roles = [
        { name:'超级管理员', code:'ROLE_ADMIN', icon:'bi-shield-check', color:'#2563eb', bg:'#dbeafe', permIds: adminPermIds, badge:'bg-success' },
        { name:'普通读者', code:'ROLE_READER', icon:'bi-person', color:'#d97706', bg:'#fef3c7', permIds: readerPermIds, badge:'bg-warning' }
    ];

    var html = '';
    roles.forEach(function(r) {
        var permHtml = '';
        allPerms.forEach(function(p) {
            var checked = r.permIds.indexOf(p.id) >= 0;
            permHtml += '<li>' + (checked ? '<i class="bi bi-check-circle-fill"></i>' : '<i class="bi bi-x-circle" style="color:#d0d5dd"></i>') + p.name + '</li>';
        });
        html += '<div class="col-md-6"><div class="role-card">' +
            '<div class="role-icon" style="background:' + r.color + '"><i class="bi ' + r.icon + '"></i></div>' +
            '<div class="role-name">' + r.name + '</div>' +
            '<div class="role-code">' + r.code + '</div>' +
            '<ul class="perm-list">' + permHtml + '</ul>' +
            '<div class="mt-3"><span class="badge ' + r.badge + '">启用</span></div>' +
        '</div></div>';
    });
    document.getElementById('roleCards').innerHTML = html;
}

async function loadLogs(page) {
    if (page) logPageNum = page;
    var res = await api.get('/admin/logs', { pageNum: logPageNum, pageSize: logPageSize });
    var pageData = res.data;
    var list = pageData && pageData.records || [];
    var badges = {'登录':'badge-info','新增':'badge-success','修改':'badge-warning','删除':'badge-danger'};
    var html = '';
    if (list.length) {
        list.forEach(function(l) {
            var bc = badges[l.operation] || 'badge-secondary';
            html += '<tr><td>' + formatDate(l.createTime, true) + '</td><td>' + (l.username||'-') + '</td>' +
                '<td><span class="badge ' + bc + '">' + (l.operation||'-') + '</span></td>' +
                '<td>' + (l.target||'-') + '</td><td>' + (l.detail||'') + '</td><td>' + (l.ip||'-') + '</td></tr>';
        });
    } else {
        html = '<tr><td colspan="6" class="table-empty"><div class="empty-emoji"><div class="emoji-icon">📝</div><div class="empty-title">操作日志功能开发中</div><div class="empty-desc">后续版本将支持更丰富日志记录</div></div></td></tr>';
    }
    document.getElementById('logTbody').innerHTML = html;
    renderPagination('logPagination', pageData, 'loadLogs');
}
</script>
</body>
</html>
