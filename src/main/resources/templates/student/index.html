<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的首页 - 智慧书阁</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="student-hero">
    <div class="hero-particle">📖</div>
    <div class="hero-particle">📚</div>
    <div class="hero-particle">✨</div>
    <div class="hero-particle">🌟</div>
    <div class="hero-particle">📖</div>
    <div class="hero-particle">📚</div>
    <div class="hero-particle">✨</div>
    <div class="hero-particle">🌟</div>

    <div class="container position-relative">
        <div class="d-flex align-items-center gap-4">
            <div class="avatar-lg" id="avatarInitial">?</div>
            <div class="flex-grow-1">
                <h1 id="welcomeName">在书籍的世界里，遇见更好的自己</h1>
                <div class="hero-sub" id="welcomeSub">智慧书阁 · 知识的海洋</div>
            </div>
            <div class="d-flex gap-2 flex-shrink-0">
                <a href="/student/books" class="btn-hero-outline"><i class="bi bi-search"></i> 浏览图书</a>
                <a href="/student/profile" class="btn-hero-outline"><i class="bi bi-gear"></i> 个人中心</a>
            </div>
        </div>
    </div>
</div>

<div class="container mt-4">
    <!-- 统计卡片 -->
    <div class="row g-3 mb-4" id="statsRow"></div>

    <!-- 公告栏 -->
    <div class="alert alert-info d-flex align-items-center gap-2 py-2 px-3 mb-4" id="announceBar" style="display:none;">
        <i class="bi bi-megaphone flex-shrink-0"></i>
        <span id="announceText" class="small flex-grow-1"></span>
        <button class="btn-close" onclick="this.parentElement.style.display='none'"></button>
    </div>

    <!-- 热门排行 + 最新上架 -->
    <div class="row g-4 mb-4">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header"><i class="bi bi-fire text-danger"></i> 热门排行</div>
                <div class="card-body p-3" id="popularList"></div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card">
                <div class="card-header"><i class="bi bi-star text-warning"></i> 最新上架</div>
                <div class="card-body p-3"><div class="row g-3" id="latestGrid"></div></div>
            </div>
        </div>
    </div>

    <!-- 借阅提醒 时间轴 -->
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-clock"></i> 借阅提醒</span>
            <a href="/student/my-borrows" class="btn btn-sm btn-outline-primary">查看全部</a>
        </div>
        <div class="card-body p-0" id="reminderList">
            <div class="p-4 text-center text-muted"><i class="bi bi-check-circle fs-3 d-block mb-2 text-success"></i>暂无借阅，去发现好书吧！</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app-common.js"></script>
<script src="/js/student-common.js"></script>
<script>
(function(){
    initStudentPage();
    var user = auth.getUser();
    if (user) {
        document.getElementById('welcomeSub').textContent = (user.realName || user.username) + ' · 在书籍的世界里，遇见更好的自己';
        document.getElementById('avatarInitial').textContent = (user.realName || user.username).charAt(0);
    }
    loadDashboard();
    loadAnnouncements();
})();

// ---------- 公告 ----------
async function loadAnnouncements() {
    var res = await api.get('/announcements');
    var bar = document.getElementById('announceBar');
    var text = document.getElementById('announceText');
    if (res.code === 200 && res.data && res.data.length) {
        bar.style.display = 'flex';
        text.textContent = res.data[0].title + (res.data[0].content ? ' — ' + res.data[0].content : '');
    }
}

// ---------- 3D 倾斜 ----------
function initTilt(selector) {
    document.querySelectorAll(selector).forEach(function(card) {
        card.addEventListener('mousemove', function(e) {
            var inner = card.querySelector('.card-inner');
            if (!inner) return;
            var rect = card.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateX = ((y - centerY) / centerY) * -8;
            var rotateY = ((x - centerX) / centerX) * 8;
            inner.style.transform = 'rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale3d(1.02,1.02,1.02)';
        });
        card.addEventListener('mouseleave', function() {
            var inner = card.querySelector('.card-inner');
            if (inner) inner.style.transform = '';
        });
    });
}

// ---------- 仪表盘 ----------
async function loadDashboard() {
    var [borrowsRes, booksRes, popularRes] = await Promise.all([
        api.get('/borrow/my'),
        api.get('/books', { pageSize: 4 }),
        api.get('/books/popular', { limit: 6 })
    ]);

    var borrows = borrowsRes.data || [];
    var borrowing = borrows.filter(function(b){ return b.status === 0; }).length;
    var overdue = borrows.filter(function(b){ return b.status === 2; }).length;
    var pending = borrows.filter(function(b){ return b.status === 3; }).length;
    var returned = borrows.filter(function(b){ return b.status === 1; }).length;

    // 统计卡片
    var stats = [
        { icon:'bi-journal-check', color:'#2563eb', bg:'#dbeafe', label:'借阅中', value:borrowing, trend:'+' + (borrowing || 0) },
        { icon:'bi-exclamation-triangle', color:'#dc2626', bg:'#fee2e2', label:'已逾期', value:overdue, trend: overdue > 0 ? '+' + overdue : '0' },
        { icon:'bi-hourglass-split', color:'#d97706', bg:'#fef3c7', label:'待审批', value:pending, trend:'+' + (pending || 0) },
        { icon:'bi-check2-all', color:'#16a34a', bg:'#dcfce7', label:'已归还', value:returned, trend:'+' + (returned || 0) }
    ];
    var statsHtml = '';
    stats.forEach(function(s) {
        var trendClass = parseInt(s.trend) > 0 ? 'up' : '';
        statsHtml += '<div class="col-md-3 col-6"><div class="stat-modern">' +
            '<div class="stat-icon-round" style="background:' + s.color + '"><i class="bi ' + s.icon + '"></i></div>' +
            '<div class="stat-body"><div class="number" style="color:' + s.color + '">' + s.value + '</div>' +
            '<div class="label">' + s.label + '</div>' +
            '<div class="trend ' + trendClass + '">较上周 ' + s.trend + '</div></div></div></div>';
    });
    document.getElementById('statsRow').innerHTML = statsHtml;

    // 热门排行 (横向卡片)
    var popular = popularRes.data || [];
    var popularHtml = '';
    if (popular.length) {
        popular.forEach(function(b, i) {
            var rankClass = i === 0 ? 'top1' : (i === 1 ? 'top2' : (i === 2 ? 'top3' : ''));
            var rankLabels = ['🔥', '🥈', '🥉', '4', '5', '6'];
            var coverUrl = getCoverUrl(b, 'S');
            var coverHtml = coverUrl ? '<img src="' + coverUrl + '" class="popular-cover" alt="" onerror="this.outerHTML=\'<div class=\\\'popular-cover-fallback\\\'>' + (b.title.charAt(0) || '?') + '</div>\'">' : '<div class="popular-cover-fallback">' + (b.title.charAt(0) || '?') + '</div>';
            popularHtml += '<div class="popular-card mb-2" onclick="location.href=\'/student/book-detail?id=' + b.id + '\'">' +
                '<div class="popular-rank ' + rankClass + '">' + rankLabels[i] + '</div>' +
                coverHtml +
                '<div class="popular-info"><div class="popular-title">' + b.title + '</div>' +
                '<div class="popular-author">' + (b.author || '佚名') + '</div>' +
                '<div class="popular-count"><i class="bi bi-heart"></i> 借阅 ' + (b.borrowCount || 0) + ' 次</div></div></div>';
        });
    } else {
        popularHtml = '<div class="text-center text-muted py-4"><i class="bi bi-inbox fs-3 d-block mb-2"></i>暂无热门数据</div>';
    }
    document.getElementById('popularList').innerHTML = popularHtml;

    // 最新上架 (2x2 3D卡片)
    var latest = booksRes.data && booksRes.data.records || [];
    var latestHtml = '';
    if (latest.length) {
        latest.forEach(function(b) {
            latestHtml += '<div class="col-6"><div class="book-card-3d">' +
                '<div class="card-inner">' +
                '<div class="cover-layer">' + getCoverHtml(b, 'small') + '</div>' +
                '<div class="info-layer"><div class="title">' + b.title + '</div>' +
                '<small class="text-muted">' + (b.author || '佚名') + '</small><br>' +
                '<span class="badge badge-success" style="font-size:.7rem">可借 ' + (b.availableQuantity || 0) + '</span></div></div></div></div>';
        });
    } else {
        latestHtml = '<div class="col-12 text-center text-muted py-4"><i class="bi bi-inbox fs-3 d-block mb-2"></i>暂无新书</div>';
    }
    document.getElementById('latestGrid').innerHTML = latestHtml;

    // 启用 3D 倾斜
    initTilt('.book-card-3d');

    // 借阅提醒 — 时间轴
    var dueItems = borrows.filter(function(b){ return b.status === 0 || b.status === 2 || b.status === 3; }).slice(0, 5);
    var reminderHtml = '';
    if (dueItems.length) {
        dueItems.forEach(function(b) {
            var isOverdue = b.status === 2;
            var isPending = b.status === 3;
            var dotClass = isOverdue ? 'dot-red' : (isPending ? 'dot-orange' : 'dot-green');
            var flashClass = isOverdue ? 'overdue-flash' : '';
            var statusText = isOverdue ? '已逾期 ' + (b.overdueDays || 0) + ' 天' : (isPending ? '待审批' : '阅读中');
            var actionHtml = (isOverdue || b.status === 0)
                ? '<button class="btn btn-sm btn-outline-success" onclick="returnBorrow(' + b.id + ')">归还</button>'
                : '<small class="text-muted">审批中</small>';
            reminderHtml += '<div class="timeline-item ' + flashClass + '"><div class="timeline-line"><div class="timeline-dot ' + dotClass + '"></div></div>' +
                '<div class="timeline-content d-flex align-items-center gap-2"><div class="flex-grow-1"><div class="fw-medium">' + (b.bookTitle || '未知') + '</div>' +
                '<small class="text-muted">应还: ' + formatDate(b.dueTime) + ' · ' + statusText + '</small></div>' + actionHtml + '</div></div>';
        });
    } else {
        reminderHtml = '<div class="p-4 text-center text-muted"><i class="bi bi-check-circle fs-3 d-block mb-2 text-success"></i>暂无借阅，去发现好书吧！</div>';
    }
    document.getElementById('reminderList').innerHTML = '<div class="timeline">' + reminderHtml + '</div>';
}</script>
</body>
</html>
