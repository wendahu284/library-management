<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书详情 - 智慧书阁</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="client-redirect-banner">📢 此页面已升级，<a href="/student/book-detail?id=${bookId}">点击前往新版</a></div>
<nav class="navbar navbar-dark bg-primary"><div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-book-half"></i> 智慧书阁</a>
    <div id="navRight"></div>
</div></nav>
<div class="container my-4">
    <div id="msg"></div>
    <a href="/" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> 返回</a>
    <div class="row" id="detail"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
const bid = new URLSearchParams(location.search).get('id');
if(!bid) location.href='/';
// 更新升级横幅中的链接
document.querySelector('.client-redirect-banner a').href = '/student/book-detail?id=' + bid;
renderNav();
fetch('/api/books/'+bid).then(r=>r.json()).then(res=>{
    if(res.code!==200){ location.href='/'; return; }
    const b = res.data;
    document.getElementById('detail').innerHTML = `
        <div class="col-md-4">${getCoverHtml(b, 'large')}</div>
        <div class="col-md-8">
            <h3>${b.title}</h3><hr>
            <p><strong>作者：</strong>${b.author||'暂无'}</p>
            <p><strong>出版社：</strong>${b.publisher||'暂无'}</p>
            <p><strong>ISBN：</strong>${b.isbn||'暂无'}</p>
            <p><strong>分类：</strong>${b.categoryName||'未分类'}</p>
            <p><strong>库存：</strong><span class="badge bg-success">可借 ${b.availableQuantity}</span> / 共 ${b.totalQuantity}</p>
            <hr><h6>简介：</h6><p class="text-muted">${b.description||'暂无简介'}</p>
            <div class="mt-3" id="borrowBtn"></div>
        </div>`;
    // 借阅按钮
    const user = JSON.parse(localStorage.getItem('user')||'null');
    if(user){
        if(b.availableQuantity>0){
            document.getElementById('borrowBtn').innerHTML = '<button class="btn btn-success btn-lg" onclick="borrow('+b.id+')"><i class="bi bi-journal-plus"></i> 立即借阅</button>';
        } else {
            document.getElementById('borrowBtn').innerHTML = '<button class="btn btn-secondary btn-lg" disabled>已全部借出</button>';
        }
    } else {
        document.getElementById('borrowBtn').innerHTML = '<a href="/login" class="btn btn-primary btn-lg">登录后借阅</a>';
    }
});

function borrow(bookId){
    fetch('/api/borrow/'+bookId, {method:'POST'}).then(r=>r.json()).then(res=>{
        showMsg(res.code===200?'success':'danger', res.message);
    });
}
function showMsg(type,text){ document.getElementById('msg').innerHTML=`<div class="alert alert-${type}">${text}</div>`; }
</script>
</body>
</html>
