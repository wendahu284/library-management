<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 智慧书阁</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="client-redirect-banner">📢 此页面已升级，<a href="/student/profile">点击前往新版</a></div>
<nav class="navbar navbar-dark bg-primary"><div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-book-half"></i> 智慧书阁</a>
    <div id="navRight"></div>
</div></nav>
<div class="container my-4">
    <div id="msg"></div>
    <div class="row"><div class="col-md-4">
        <div class="card shadow-sm text-center"><div class="card-body">
            <i class="bi bi-person-circle" style="font-size:5rem;color:#0d6efd"></i>
            <h5 id="profileName"></h5><p class="text-muted" id="profileUsername"></p>
        </div></div>
    </div>
    <div class="col-md-8">
        <div class="card shadow-sm mb-3"><div class="card-header fw-bold"><i class="bi bi-gear"></i> 个人信息</div><div class="card-body">
            <form onsubmit="updateProfile(event)">
                <div class="mb-3"><label class="form-label">真实姓名</label><input type="text" id="realName" class="form-control"></div>
                <div class="row mb-3"><div class="col-md-6"><label class="form-label">电话</label><input type="text" id="phone" class="form-control"></div>
                <div class="col-md-6"><label class="form-label">邮箱</label><input type="email" id="email" class="form-control"></div></div>
                <button class="btn btn-primary"><i class="bi bi-check-lg"></i> 保存</button>
            </form>
        </div></div>
        <div class="card shadow-sm"><div class="card-header fw-bold"><i class="bi bi-lock"></i> 修改密码</div><div class="card-body">
            <form onsubmit="changePwd(event)">
                <div class="mb-3"><label class="form-label">原密码</label><input type="password" id="oldPwd" class="form-control" required></div>
                <div class="row mb-3"><div class="col-md-6"><label class="form-label">新密码</label><input type="password" id="newPwd" class="form-control" required minlength="6"></div>
                <div class="col-md-6"><label class="form-label">确认新密码</label><input type="password" id="confirmPwd" class="form-control" required></div></div>
                <button class="btn btn-warning"><i class="bi bi-key"></i> 修改密码</button>
            </form>
        </div></div>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
const user = JSON.parse(localStorage.getItem('user')||'null');
if(!user) location.href='/login';

document.getElementById('profileName').textContent = user.realName||user.username;
document.getElementById('profileUsername').textContent = '@'+user.username;

// 加载用户信息
fetch('/api/auth/me').then(r=>r.json()).then(res=>{
    if(res.code===200){
        document.getElementById('realName').value = res.data.realName||'';
        document.getElementById('phone').value = res.data.phone||'';
        document.getElementById('email').value = res.data.email||'';
    }
});
renderNav();

function updateProfile(e){
    e.preventDefault();
    fetch('/api/auth/profile',{
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            realName: document.getElementById('realName').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value
        })
    }).then(r=>r.json()).then(res=>showMsg(res.code===200?'success':'danger',res.message));
}

function changePwd(e){
    e.preventDefault();
    const np = document.getElementById('newPwd').value;
    if(np!==document.getElementById('confirmPwd').value){ showMsg('danger','两次新密码不一致'); return; }
    fetch('/api/auth/password',{
        method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            oldPassword: document.getElementById('oldPwd').value,
            newPassword: np,
            confirmPassword: document.getElementById('confirmPwd').value
        })
    }).then(r=>r.json()).then(res=>{
        showMsg(res.code===200?'success':'danger',res.message);
        if(res.code===200) setTimeout(()=>{ localStorage.clear(); location.href='/login'; },1500);
    });
}
function showMsg(type,text){ document.getElementById('msg').innerHTML=`<div class="alert alert-${type}">${text}</div>`; }
</script>
</body>
</html>
