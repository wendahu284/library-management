<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>读者注册 - 智慧书阁</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="client-redirect-banner">📢 此页面已升级，<a href="/student/register.html">点击前往新版</a></div>
<div class="container"><div class="row justify-content-center mt-5"><div class="col-md-6">
    <div class="text-center mb-4"><a href="/" class="text-decoration-none"><h2 class="text-primary"><i class="bi bi-book-half"></i> 智慧书阁</h2></a><p class="text-muted">读者注册</p></div>
    <div id="msg"></div>
    <div class="card shadow"><div class="card-body p-4">
        <form onsubmit="register(event)">
            <div class="mb-3"><label class="form-label">用户名 <span class="text-danger">*</span></label><input type="text" id="username" class="form-control" required minlength="3"></div>
            <div class="row mb-3"><div class="col-md-6"><label class="form-label">密码 <span class="text-danger">*</span></label><input type="password" id="password" class="form-control" required minlength="6"></div>
            <div class="col-md-6"><label class="form-label">确认密码 <span class="text-danger">*</span></label><input type="password" id="confirmPassword" class="form-control" required></div></div>
            <div class="mb-3"><label class="form-label">真实姓名</label><input type="text" id="realName" class="form-control"></div>
            <div class="row mb-3"><div class="col-md-6"><label class="form-label">电话</label><input type="text" id="phone" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">邮箱</label><input type="email" id="email" class="form-control"></div></div>
            <button type="submit" class="btn btn-primary w-100 mb-2"><i class="bi bi-person-plus"></i> 注册</button>
            <div class="text-center"><a href="/login">已有账号？立即登录</a></div>
        </form>
    </div></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function register(e) {
    e.preventDefault();
    const pwd = document.getElementById('password').value;
    const cpwd = document.getElementById('confirmPassword').value;
    if(pwd!==cpwd){ showMsg('danger','两次密码不一致'); return; }
    fetch('/api/auth/register',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: pwd, confirmPassword: cpwd,
            realName: document.getElementById('realName').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            email: document.getElementById('email').value.trim()
        })
    }).then(r=>r.json()).then(res=>{
        if(res.code===200){ showMsg('success','注册成功！3秒后跳转登录'); setTimeout(()=>location.href='/login',3000); }
        else showMsg('danger',res.message);
    }).catch(()=>showMsg('danger','网络异常'));
}
function showMsg(type,text){ document.getElementById('msg').innerHTML=`<div class="alert alert-${type}">${text}</div>`; }
</script>
</body>
</html>
